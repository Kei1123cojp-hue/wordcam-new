<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WordCam</title>
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#1b293b;--muted:#9eafc4;--line:#314158;--accent:#79b8ff;--green:#8de0b0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:calc(14px + env(safe-area-inset-top)) 18px 14px;background:#121e2e;position:sticky;top:0;z-index:4;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0}header p{margin:4px 0 0;color:var(--muted);font-size:12px}
main{max-width:760px;margin:auto;padding:16px 14px 40px}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{flex:1;border:1px solid var(--line);background:var(--panel);color:#dce7f4;border-radius:12px;padding:12px;font-size:14px;font-weight:700}.tab.active{background:#24466b;border-color:#5795d2;color:white}
.panel{display:none}.panel.active{display:block}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:13px}
h2{font-size:17px;margin:0 0 12px}.hint{color:var(--muted);font-size:12px;line-height:1.6}
input[type=search]{width:100%;background:#0f1a29;border:1px solid #40536c;color:white;border-radius:12px;padding:15px;font-size:17px;outline:none}
input:focus{border-color:var(--accent)}.results{margin-top:10px;display:grid;gap:8px}.result{width:100%;text-align:left;background:#142235;border:1px solid var(--line);border-radius:12px;padding:12px;color:white}.term{font-size:16px;font-weight:750}.meaning{color:#d2deeb;font-size:14px;margin-top:5px;line-height:1.5}.tag{float:right;color:var(--muted);font-size:10px;border:1px solid var(--line);padding:3px 6px;border-radius:20px}
#videoWrap{position:relative;overflow:hidden;border-radius:14px;background:#05090f;aspect-ratio:4/3}video{width:100%;height:100%;object-fit:cover}#overlay{position:absolute;inset:15% 5%;border:2px solid #7bd8a6;border-radius:10px;pointer-events:none;box-shadow:0 0 0 999px #0003}
button.action{background:#2866a0;border:0;color:white;padding:12px 15px;border-radius:11px;font-size:14px;font-weight:700;margin:8px 6px 0 0}button.secondary{background:#35465c}
#cameraStatus{color:var(--muted);font-size:12px;margin-top:9px}#cameraResult{min-height:74px}.empty{padding:14px;color:var(--muted);font-size:13px;text-align:center}
#selected{margin-top:12px;padding:14px;background:#102d25;border:1px solid #32634f;border-radius:12px;display:none}#selected strong{font-size:20px}#selected p{margin:7px 0 0;line-height:1.6}
small{color:var(--muted)}.count{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header><h1>WordCam</h1><p><span id="total">2016</span>件登録済み · 単語・熟語を検索／カメラ認識</p></header>
<main>
<div class="tabs">
<button class="tab active" data-tab="camera">📷 カメラ</button>
<button class="tab" data-tab="words">A 単語検索</button>
<button class="tab" data-tab="idioms">▤ 熟語検索</button>
</div>
<section id="camera" class="panel active">
<div class="card"><h2>カメラで英単語を認識</h2>
<div id="videoWrap"><video id="video" playsinline autoplay muted></video><div id="overlay"></div></div>
<button class="action" id="start">カメラを起動</button><button class="action secondary" id="scan">今すぐ読み取る</button><button class="action secondary" id="stop">停止</button>
<div id="cameraStatus">カメラを起動して、英単語が枠内に入るようにしてください。</div>
<div id="cameraResult" class="hint"></div>
<div id="selected"><strong id="foundTerm"></strong><p id="foundMeaning"></p></div>
</div>
<div class="card hint">認識にはインターネット接続とカメラの使用許可が必要です。iPhoneではHTTPS（GitHub Pages等）で開いてください。印刷物に近づけすぎず、文字にピントが合う距離で読み取ってください。</div>
</section>
<section id="words" class="panel">
<div class="card"><h2>登録済み英単語を検索</h2><input id="wordSearch" type="search" placeholder="例：word（1文字から候補表示）" autocomplete="off"><div id="wordResults" class="results"><div class="empty">文字を入力すると候補が表示されます</div></div></div>
</section>
<section id="idioms" class="panel">
<div class="card"><h2>登録済み英熟語を検索</h2><input id="idiomSearch" type="search" placeholder="例：give up（1文字から候補表示）" autocomplete="off"><div id="idiomResults" class="results"><div class="empty">文字を入力すると候補が表示されます</div></div></div>
</section>
</main>

const words=DATA.filter(x=>x.type==="word"), idioms=DATA.filter(x=>x.type==="idiom");
document.getElementById('total').textContent=DATA.length;
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')}));
function norm(s){return s.toLowerCase().replace(/[’‘']/g,"'").replace(/[‐‑‒–—-]/g,' ').replace(/[.,!?;:()[\]{}]/g,' ').replace(/\s+/g,' ').trim().replace(/[～〜~]/g,'');}
function renderSearch(inputId,resultsId,items){
 const input=document.getElementById(inputId), box=document.getElementById(resultsId);
 input.addEventListener('input',()=>{const q=norm(input.value);if(!q){box.innerHTML='<div class="empty">文字を入力すると候補が表示されます</div>';return}
 const matches=items.filter(x=>norm(x.term).startsWith(q)||norm(x.term).includes(q)).slice(0,60);
 box.innerHTML=matches.length?matches.map(x=>`<button class="result" data-id="${x.id}"><span class="tag">No. ${x.id}</span><div class="term">${escapeHtml(x.term)}</div><div class="meaning">${escapeHtml(x.meaning)}</div></button>`).join(''):'<div class="empty">該当する登録済み項目はありません</div>';
 });
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
renderSearch('wordSearch','wordResults',words);renderSearch('idiomSearch','idiomResults',idioms);
let stream=null,worker=null,busy=false,lastText='',lastMatch=0,autoTimer=null;
const video=document.getElementById('video'),status=document.getElementById('cameraStatus'),out=document.getElementById('cameraResult');
async function getWorker(){
 if(worker)return worker;
 status.textContent='文字認識エンジンを読み込み中…';
 if(!window.Tesseract) await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});
 worker=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text')status.textContent='文字を認識中… '+Math.round((m.progress||0)*100)+'%'}});
 return worker;
}
async function startCamera(){
 try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('この環境ではカメラを利用できません。HTTPSで開いてください。');
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
 video.srcObject=stream;await video.play();status.textContent='カメラ起動中。枠内の文字を自動で読み取ります。';autoScanLoop();
 }catch(e){status.textContent='カメラを起動できませんでした：'+e.message}
}
function stopCamera(){if(autoTimer){clearTimeout(autoTimer);autoTimer=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;status.textContent='カメラを停止しました。'}
function autoScanLoop(){if(autoTimer)clearTimeout(autoTimer);autoTimer=setTimeout(async()=>{if(stream){await scan();autoScanLoop()}},1700)}
async function scan(){
 if(!stream||!video.videoWidth){status.textContent='先にカメラを起動してください。';return}
 if(busy)return;busy=true;
 try{
  const w=await getWorker(),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
  const vw=video.videoWidth,vh=video.videoHeight;const cropW=Math.floor(vw*.9),cropH=Math.floor(vh*.7),sx=Math.floor((vw-cropW)/2),sy=Math.floor((vh-cropH)/2);
  canvas.width=cropW*1.5;canvas.height=cropH*1.5;ctx.drawImage(video,sx,sy,cropW,cropH,0,0,canvas.width,canvas.height);
  const {data:{text}}=await w.recognize(canvas);lastText=text;out.textContent='読み取り：'+text.replace(/\s+/g,' ').trim().slice(0,180);
  matchText(text);
 }catch(e){status.textContent='読み取りエラー：'+e.message}
 finally{busy=false}
}
function matchText(text){
 const t=norm(text);let best=null,bestLen=0;
 for(const x of DATA){const term=norm(x.term);if(!term)continue;
  const variants=[term,term.replace(/\s+/g,'')];
  for(const v of variants){if(v.length>=bestLen&&t.includes(v)){best=x;bestLen=v.length}}
 }
 const panel=document.getElementById('selected');
 if(best){document.getElementById('foundTerm').textContent=best.term;document.getElementById('foundMeaning').textContent=best.meaning;panel.style.display='block';status.textContent='登録済み項目を認識しました。'}
 else{panel.style.display='none';status.textContent='登録済みの単語・熟語は見つかりませんでした。文字が鮮明になるよう調整して再度読み取ってください。'}
}
document.getElementById('start').addEventListener('click',startCamera);
document.getElementById('stop').addEventListener('click',stopCamera);
document.getElementById('scan').addEventListener('click',scan);
window.addEventListener('pagehide',stopCamera);
